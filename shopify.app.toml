# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e02c40f947f6de6b72eecd8c67b46fa2"
name = "PartnerLoop: Creator Growth"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Keep this list to scopes the app actually uses — over-requesting is an App Store
# submission blocker (see SHOPIFY_APP_PLAYBOOK.md §10).
#   read_products   — product pickers for per-product commission rules
#   read_orders     — referral attribution from orders
#   read_customers  — matching referred orders back to customers
#   write_discounts — generating each creator's unique coupon code (coupon tracking)
#   read_themes     — reading config/settings_data.json to detect whether the
#                     tracking app embed is switched on in the live theme
scopes = "read_products,read_orders,read_customers,write_discounts,read_themes"

# Lets the storefront call this app same-origin, with Shopify signing every
# request. The theme app embed posts clicks to /apps/partnerloop/track, which
# Shopify forwards to <app url>/proxy/track.
[app_proxy]
url = "https://example.com/proxy"
subpath = "partnerloop"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Turns a referred order into a Referral + Commission. Cancellations and
  # refunds will need their own subscriptions to revise those figures.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # Revise a commission when the order behind it changes. Without these, a
  # refunded order keeps paying out.
  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

[auth]
# Must match `authPathPrefix` in app/shopify.server.js ("/auth"), otherwise the
# OAuth callback 404s in production (see SHOPIFY_APP_PLAYBOOK.md §6).
redirect_urls = [ "https://example.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
